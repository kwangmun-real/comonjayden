<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>주식 브리핑</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262a33; --fg:#e6e8ec; --dim:#9aa3af;
          --up:#22c55e; --down:#ef4444; --accent:#6366f1; }
  * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         line-height:1.65; }
  .wrap { max-width:820px; margin:0 auto; padding:20px 16px 64px; }
  #gate { min-height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  #gate h1 { font-size:20px; margin:0; font-weight:650; letter-spacing:-.2px; }
  #gate p { color:var(--dim); font-size:13px; margin:0; text-align:center; }
  #pin { width:220px; padding:14px 16px; font-size:22px; letter-spacing:6px; text-align:center;
         background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px; }
  #pin:focus { outline:none; border-color:var(--accent); }
  button { padding:13px 30px; font-size:15px; font-weight:600; border:0; border-radius:12px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  #err { color:var(--down); font-size:13px; min-height:18px; }
  #report { display:none; }
  #report h1 { font-size:21px; margin:.2em 0 .8em; letter-spacing:-.3px; }
  #report h2 { font-size:16px; margin:1.9em 0 .6em; padding-bottom:.35em;
               border-bottom:1px solid var(--line); }
  #report table { width:100%; border-collapse:collapse; margin:.9em 0; font-size:13.5px;
                  font-variant-numeric:tabular-nums; }
  #report th, #report td { padding:8px 9px; border-bottom:1px solid var(--line); text-align:right; }
  #report th:first-child, #report td:first-child { text-align:left; }
  #report th { color:var(--dim); font-weight:600; font-size:12.5px; white-space:nowrap; }
  #report blockquote { margin:.9em 0; padding:11px 14px; background:var(--card);
                       border-left:3px solid var(--accent); border-radius:0 8px 8px 0;
                       color:var(--dim); font-size:13.5px; }
  #report code { background:var(--card); padding:1px 5px; border-radius:5px; font-size:.9em; }
  #report ul, #report ol { padding-left:1.3em; }
  #report li { margin:.3em 0; }
  #report strong { font-weight:650; }
  .tbl-scroll { overflow-x:auto; }
  .meta { color:var(--dim); font-size:12px; margin-top:2.6em; padding-top:1em;
          border-top:1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate">
    <h1>🔒 주식 브리핑</h1>
    <p>PIN을 입력하면 리포트가 열립니다.<br>이 페이지에는 암호문만 저장돼 있습니다.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="····">
    <button id="go">열기</button>
    <div id="err"></div>
  </div>
  <div id="report"></div>
</div>

<script>

const $ = s => document.querySelector(s);
const dec = new TextDecoder();
const b2a = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function decrypt(pin) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin),
                                             "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b2a(PAYLOAD.kdf.salt),
      iterations:PAYLOAD.kdf.iterations, hash:PAYLOAD.kdf.hash },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name:"AES-GCM", iv:b2a(PAYLOAD.cipher.iv) }, key, b2a(PAYLOAD.cipher.data));
  return dec.decode(plain);
}

// 리포트에 쓰이는 문법만 처리하는 최소 마크다운 렌더러.
// 외부 라이브러리를 쓰지 않는다 — CDN 의존을 만들면 오프라인·CSP에서 깨진다.
function render(md) {
  const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

  const out = [];
  const lines = md.split("\n");
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];

    if (/^\s*\|/.test(ln) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1] || "")) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(ln);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push('<div class="tbl-scroll"><table><thead><tr>'
        + head.map(h => `<th>${inline(h)}</th>`).join("")
        + "</tr></thead><tbody>"
        + rows.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("")
        + "</tbody></table></div>");
      continue;
    }

    let m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) {
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    } else if (/^\s*>/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${buf.map(inline).join("<br>")}</blockquote>`);
      continue;
    } else if (/^\s*(?:[-·*]|\d+\.)\s+/.test(ln)) {
      const ordered = /^\s*\d+\./.test(ln);
      const buf = [];
      while (i < lines.length && /^\s*(?:[-·*]|\d+\.)\s+/.test(lines[i])) {
        buf.push(lines[i++].replace(/^\s*(?:[-·*]|\d+\.)\s+/, ""));
      }
      const t = ordered ? "ol" : "ul";
      out.push(`<${t}>` + buf.map(b => `<li>${inline(b)}</li>`).join("") + `</${t}>`);
      continue;
    } else if (/^\s*---+\s*$/.test(ln)) {
      // 구분선은 h2 밑줄과 겹쳐 보이므로 버린다
    } else if (ln.trim() === "") {
      // 빈 줄 무시
    } else {
      out.push(`<p>${inline(ln)}</p>`);
    }
    i++;
  }
  return out.join("\n");
}

async function open_() {
  const pin = $("#pin").value.trim();
  if (!pin) return;
  $("#go").disabled = true;
  $("#err").textContent = "";
  $("#go").textContent = "복호화 중…";
  try {
    const md = await decrypt(pin);
    $("#report").innerHTML = render(md)
      + `<div class="meta">생성 ${PAYLOAD.generated_at} · 이 페이지는 검색에 노출되지 않습니다</div>`;
    $("#gate").style.display = "none";
    $("#report").style.display = "block";
  } catch (e) {
    $("#err").textContent = "PIN이 맞지 않습니다.";
    $("#pin").value = "";
    $("#pin").focus();
  } finally {
    $("#go").disabled = false;
    $("#go").textContent = "열기";
  }
}

$("#go").addEventListener("click", open_);
$("#pin").addEventListener("keydown", e => { if (e.key === "Enter") open_(); });
$("#pin").focus();
</script>

</html>
